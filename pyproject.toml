[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "makercex"
version = "1.0.0"
description = "Entry-markout decomposition on crypto perpetual order books"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Daniel Gatto" }]
dependencies = ["numpy>=1.24"]

[project.scripts]
makercex = "makercex.cli:main"

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
data = ["pyarrow>=12"]

[tool.setuptools]
packages = ["makercex"]
